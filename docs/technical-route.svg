<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="840" viewBox="0 0 1600 840">
  <defs>
    <style>
      .page { fill: #ffffff; stroke: #111111; stroke-width: 1.5; }
      .layer { fill: #fbfbfb; stroke: #111111; stroke-width: 3; }
      .box { fill: #f4f4f4; stroke: #333333; stroke-width: 2; }
      .box2 { fill: #ffffff; stroke: #333333; stroke-width: 2; }
      .title { font-family: "Microsoft YaHei", "SimSun", Arial, sans-serif; font-size: 34px; font-weight: 700; fill: #1f1f1f; }
      .layer-title { font-family: "Microsoft YaHei", "SimSun", Arial, sans-serif; font-size: 26px; font-weight: 600; fill: #1f1f1f; }
      .label { font-family: "Microsoft YaHei", "SimSun", Arial, sans-serif; font-size: 22px; fill: #222222; }
      .tiny { font-family: "Microsoft YaHei", "SimSun", Arial, sans-serif; font-size: 16px; fill: #333333; }
      .arrow { stroke: #111111; stroke-width: 2.2; fill: none; marker-end: url(#arrow); }
      .dash { stroke: #777777; stroke-width: 1.8; stroke-dasharray: 6 6; fill: none; marker-end: url(#arrowGrey); }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#111111"/>
    </marker>
    <marker id="arrowGrey" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#777777"/>
    </marker>
  </defs>

  <rect class="page" x="35" y="30" width="1530" height="790"/>
  <text class="title" x="800" y="82" text-anchor="middle">家庭能源管理系统（HEMS）技术路线说明图</text>

  <!-- Application layer -->
  <rect class="layer" x="120" y="120" width="1360" height="120"/>
  <text class="layer-title" x="155" y="158">应用交互层</text>
  <rect class="box" x="205" y="178" width="190" height="42"/>
  <text class="label" x="300" y="206" text-anchor="middle">首页仪表盘</text>
  <rect class="box" x="440" y="178" width="190" height="42"/>
  <text class="label" x="535" y="206" text-anchor="middle">设备管理</text>
  <rect class="box" x="675" y="178" width="190" height="42"/>
  <text class="label" x="770" y="206" text-anchor="middle">家庭平面孪生</text>
  <rect class="box" x="910" y="178" width="190" height="42"/>
  <text class="label" x="1005" y="206" text-anchor="middle">舒适度反馈</text>
  <rect class="box" x="1145" y="178" width="190" height="42"/>
  <text class="label" x="1240" y="206" text-anchor="middle">EV充电与日志</text>

  <!-- Edge API and decision layer -->
  <rect class="layer" x="120" y="285" width="1360" height="150"/>
  <text class="layer-title" x="155" y="323">边缘服务与智能决策层</text>
  <rect class="box2" x="170" y="352" width="210" height="58"/>
  <text class="label" x="275" y="377" text-anchor="middle">Node.js REST API</text>
  <text class="tiny" x="275" y="397" text-anchor="middle">本地边缘网关</text>
  <rect class="box" x="425" y="352" width="180" height="58"/>
  <text class="label" x="515" y="377" text-anchor="middle">负荷分类器</text>
  <text class="tiny" x="515" y="397" text-anchor="middle">可平移 / 柔性 / 基础</text>
  <rect class="box" x="650" y="352" width="190" height="58"/>
  <text class="label" x="745" y="377" text-anchor="middle">多目标优化器</text>
  <text class="tiny" x="745" y="397" text-anchor="middle">电费 · 碳排 · 舒适度</text>
  <rect class="box" x="885" y="352" width="190" height="58"/>
  <text class="label" x="980" y="377" text-anchor="middle">RLHF权重引擎</text>
  <text class="tiny" x="980" y="397" text-anchor="middle">用户反馈自适应</text>
  <rect class="box" x="1120" y="352" width="210" height="58"/>
  <text class="label" x="1225" y="377" text-anchor="middle">Matter指令模拟</text>
  <text class="tiny" x="1225" y="397" text-anchor="middle">On/Off · 温控 · 充电</text>

  <!-- Digital twin layer -->
  <rect class="layer" x="120" y="480" width="1360" height="145"/>
  <text class="layer-title" x="155" y="518">数字孪生仿真层</text>
  <rect class="box2" x="185" y="546" width="245" height="58"/>
  <text class="label" x="307" y="571" text-anchor="middle">住宅热力学模型</text>
  <text class="tiny" x="307" y="591" text-anchor="middle">ETP 等效热参数</text>
  <rect class="box2" x="475" y="546" width="245" height="58"/>
  <text class="label" x="597" y="571" text-anchor="middle">Heun数值求解</text>
  <text class="tiny" x="597" y="591" text-anchor="middle">1分钟步长 · 预测校正</text>
  <rect class="box2" x="765" y="546" width="245" height="58"/>
  <text class="label" x="887" y="571" text-anchor="middle">多房间耦合模型</text>
  <text class="tiny" x="887" y="591" text-anchor="middle">分区温度 · 气流传热</text>
  <rect class="box2" x="1055" y="546" width="245" height="58"/>
  <text class="label" x="1177" y="571" text-anchor="middle">状态映射与预测</text>
  <text class="tiny" x="1177" y="591" text-anchor="middle">房间状态 · 能耗趋势</text>

  <!-- Data acquisition layer -->
  <rect class="layer" x="120" y="670" width="1360" height="120"/>
  <text class="layer-title" x="155" y="708">设备与数据获取层</text>
  <rect class="box2" x="185" y="732" width="245" height="42"/>
  <text class="label" x="307" y="760" text-anchor="middle">智能家电设备</text>
  <rect class="box2" x="475" y="732" width="245" height="42"/>
  <text class="label" x="597" y="760" text-anchor="middle">能源与环境信号</text>
  <rect class="box2" x="765" y="732" width="245" height="42"/>
  <text class="label" x="887" y="760" text-anchor="middle">EV与可平移负荷</text>
  <rect class="box2" x="1055" y="732" width="245" height="42"/>
  <text class="label" x="1177" y="760" text-anchor="middle">本地设备池</text>

  <!-- Layer flow arrows -->
  <path class="arrow" d="M800 240 L800 273"/>
  <path class="dash" d="M860 273 C900 260, 900 248, 875 238"/>

  <path class="arrow" d="M800 435 L800 468"/>
  <path class="dash" d="M860 468 C900 455, 900 443, 875 433"/>

  <path class="arrow" d="M800 625 L800 658"/>
  <path class="dash" d="M860 658 C900 645, 900 633, 875 623"/>
</svg>
